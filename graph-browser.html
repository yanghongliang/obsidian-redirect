<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中物理知识图谱浏览器</title>
<!-- v15 思维导图树形视图 -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;height:100vh;display:flex;flex-direction:column}
header{background:#1a73e8;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:600}
header .stats{font-size:13px;opacity:.9}
#searchBox{display:flex;gap:8px;flex:1;min-width:200px;max-width:500px}
#searchInput{flex:1;padding:8px 12px;border:none;border-radius:6px;font-size:14px}
#searchBtn{padding:8px 16px;border:none;border-radius:6px;background:#fff;color:#1a73e8;font-weight:600;cursor:pointer;font-size:14px}
#breadcrumb{padding:8px 20px;background:#e8f0fe;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#breadcrumb span{cursor:pointer;color:#1a73e8}
#breadcrumb span:hover{text-decoration:underline}
#breadcrumb .sep{color:#999;cursor:default}
#main{flex:1;display:flex;overflow:hidden}
#graph{flex:1;position:relative;overflow:hidden;background:#fff}
#sidebar{width:320px;background:#fff;border-left:1px solid #e0e0e0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#sidebar h3{font-size:15px;color:#1a73e8;border-bottom:2px solid #1a73e8;padding-bottom:6px}
#nodeInfo{font-size:13px;line-height:1.7}
#nodeInfo .layer-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;color:#fff;margin-right:6px}
#neighbors{list-style:none;display:flex;flex-direction:column;gap:6px}
#neighbors li{padding:8px 10px;background:#f0f4ff;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid transparent;line-height:1.5}
#neighbors li:hover{border-color:#1a73e8;background:#e8f0fe}
#neighbors .rel{font-size:11px;color:#666;background:#e0e0e0;padding:1px 6px;border-radius:3px;margin-left:6px;white-space:nowrap}
#legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px}
#legend span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
svg{width:100%;height:100%;display:block}
.node{cursor:pointer}
.node circle{stroke:#fff;stroke-width:2}
.node text{pointer-events:none}
.node.center circle{stroke:#ff5722;stroke-width:3}
.edge{stroke:#ccc;stroke-width:1.5}
.edge-label{font-size:10px;fill:#666;pointer-events:none;background:#fff}
#hint{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;max-width:320px;line-height:1.6}

@media (max-width:768px){
header{padding:10px 12px;gap:8px}
header h1{font-size:16px}
#searchBox{max-width:100%;flex-basis:100%;order:3}
#main{flex-direction:column}
#graph{min-height:52vh;flex:none}
#sidebar{width:100%;border-left:none;border-top:1px solid #e0e0e0;max-height:44vh;padding:12px}
#legend{top:4px;left:8px;right:8px;padding:4px 8px;font-size:11px;overflow-x:auto;flex-wrap:nowrap;max-width:calc(100% - 16px)}
#hint{left:8px;right:8px;bottom:8px;max-width:none;font-size:11px;padding:6px 10px;line-height:1.5}
}
</style>
</head>
<body>
<header>
<h1>🕸️ 高中物理知识图谱</h1>
<span class="stats" id="stats"></span>
<div id="searchBox">
<input id="searchInput" placeholder="搜索节点（如：碰撞、弹簧、电场）…" onkeydown="if(event.key==='Enter')doSearch()">
<button id="searchBtn" onclick="doSearch()">搜索</button>
</div>
</header>
<div style="display:flex;align-items:center;gap:12px;padding:8px 20px;background:#e8f0fe;">
<div id="viewTabs" style="display:flex;gap:6px;">
<button id="tabTree" onclick="switchView('tree')" style="padding:6px 16px;border:none;border-radius:6px;background:#1a73e8;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">🌳 思维导图</button>
<button id="tabGraph" onclick="switchView('graph')" style="padding:6px 16px;border:none;border-radius:6px;background:#fff;color:#1a73e8;font-size:13px;cursor:pointer;">🕸️ 关系网</button>
</div>
<div id="breadcrumb" style="flex:1;"></div>
</div>
<div id="main">
<div id="graph">
<svg id="svg"></svg>
<div id="gridView" style="display:none;position:absolute;inset:0;overflow-y:auto;padding:20px;background:#fff;">
<div id="gridTitle" style="font-size:14px;color:#666;margin-bottom:12px;"></div>
<div id="gridPills" style="display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;"></div>
</div>
<div id="hint"><span id="hintClose" style="float:right;cursor:pointer;font-weight:700;margin-left:8px;">&#10005;</span>💡 从<b>高中物理</b>根节点开始，逐层展开<br>点击节点 → 展开它的一整根枝<br>拖拽平移 · 滚轮缩放 · 面包屑返回上层</div>
<div id="legend" style="position:absolute;top:8px;left:12px;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:6px;"></div>
</div>
<div id="sidebar">
<h3>📍 当前节点</h3>
<div id="nodeInfo"><p style="color:#999">点击图中节点，或上方搜索</p></div>
<h3 id="neighborTitle">🌿 相连节点 <span id="neighborCount" style="font-weight:normal;color:#666"></span></h3>
<ul id="neighbors"></ul>
</div>
</div>

const nodes = new Map();
nodes.set(ROOT_ID, {id: ROOT_ID, title: '高中物理', layer: 'root'});
GRAPH_DATA.nodes.forEach(n => nodes.set(n.id, n));

// 层节点
const layerNodes = {};
Object.keys(LAYER_NAMES).forEach(k => {
  if (k === 'root') return;
  const lid = '__LAYER_' + k + '__';
  layerNodes[k] = lid;
  nodes.set(lid, {id: lid, title: k + '层·' + LAYER_NAMES[k], layer: k, isLayer: true});
});

const adj = new Map();
function addEdge(a, b, type, dir) {
  if (!adj.has(a)) adj.set(a, []);
  adj.get(a).push({to: b, type, dir});
}
// 根→层
Object.keys(layerNodes).forEach(k => {
  addEdge(ROOT_ID, layerNodes[k], '包含', 'out');
  addEdge(layerNodes[k], ROOT_ID, '包含', 'in');
});
// 层→分类→节点（有子目录的层自动建分类节点）
GRAPH_DATA.nodes.forEach(n => {
  const parts = n.id.split('/');
  const lid = layerNodes[n.layer];
  if (!lid) return;
  if (parts.length > 2) {
    const cat = parts[1];
    const catId = '__CAT_' + n.layer + '_' + cat + '__';
    if (!nodes.has(catId)) {
      nodes.set(catId, {id: catId, title: cat, layer: n.layer, isCategory: true});
      addEdge(lid, catId, '包含', 'out');
      addEdge(catId, lid, '包含', 'in');
    }
    addEdge(catId, n.id, '包含', 'out');
    addEdge(n.id, catId, '包含', 'in');
  } else {
    addEdge(lid, n.id, '包含', 'out');
    addEdge(n.id, lid, '包含', 'in');
  }
});
// 原始边
GRAPH_DATA.edges.forEach(e => {
  addEdge(e.from, e.to, e.type, 'out');
  addEdge(e.to, e.from, e.type, 'in');
});

document.getElementById('stats').textContent = `${GRAPH_DATA.nodes.length} 知识节点 · ${GRAPH_DATA.edges.length} 条关系 · 6 层`;
document.getElementById('legend').innerHTML =
  `<span><span class="dot" style="background:${LAYER_COLORS.root}"></span>根</span>` +
  Object.keys(LAYER_COLORS).filter(k => k !== 'root').map(k =>
    `<span><span class="dot" style="background:${LAYER_COLORS[k]}"></span>${k}层</span>`).join('');

// 面包屑
let trail = [ROOT_ID];
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = trail.map((id, i) => {
    const n = nodes.get(id);
    const label = n ? n.title : id;
    if (i === trail.length - 1) return `<b>${escHtml(label)}</b>`;
    return `<span onclick="goToTrail(${i})">${escHtml(label)}</span><span class="sep">›</span>`;
  }).join('');
}
function goToTrail(i) { trail = trail.slice(0, i + 1); render(trail[trail.length - 1]); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 文字换行：每行最多N个字符
function wrapText(text, maxPerLine) {
  const lines = [];
  let cur = '';
  for (const ch of text) {
    cur += ch;
    if (cur.length >= maxPerLine) { lines.push(cur); cur = ''; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 6); // 最多6行，完整显示
}

const svg = document.getElementById('svg');
let transform = {x: 0, y: 0, k: 1};
let panning = false, panStart = null;
svg.addEventListener('mousedown', e => { panning = true; panStart = {x: e.clientX - transform.x, y: e.clientY - transform.y}; });
window.addEventListener('mouseup', () => panning = false);
window.addEventListener('mousemove', e => { if (panning) { transform.x = e.clientX - panStart.x; transform.y = e.clientY - panStart.y; applyTransform(); } });
svg.addEventListener('wheel', e => { e.preventDefault(); const f = e.deltaY < 0 ? 1.1 : 0.9; transform.k = Math.max(0.25, Math.min(3, transform.k * f)); applyTransform(); }, {passive: false});
function applyTransform() { const g = svg.querySelector('g#viewport'); if (g) g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.k})`); }

function navigateTo(id) {
  if (trail[trail.length - 1] !== id) trail.push(id);
  if (trail.length > 8) trail = trail.slice(-8);
  render(id);
}

function render(centerId) {
  renderBreadcrumb();
  const center = nodes.get(centerId);
  if (!center) return;

  let neighbors = adj.get(centerId) || [];
  const seen0 = new Set();
  neighbors = neighbors.filter(nb => { const k = nb.to; if (seen0.has(k)) return false; seen0.add(k); return true; });
  neighbors.sort((a, b) => {
    const na = nodes.get(a.to), nb2 = nodes.get(b.to);
    const la = na && na.isLayer ? 0 : 1, lb = nb2 && nb2.isLayer ? 0 : 1;
    return la - lb;
  });
  const n = neighbors.length;
  // 自适应环数：<=16单环，17-36双环，37+三环
  const ringCount = n <= 16 ? 1 : (n <= 36 ? 2 : 3);

  svg.innerHTML = '<g id="viewport"></g>';
  const vp = svg.querySelector('#viewport');
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.44;

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = '<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#999"/></marker>';
  vp.appendChild(defs);

  // 中心节点
  const gC = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  gC.setAttribute('class', 'node center');
  gC.setAttribute('transform', `translate(${cx},${cy})`);
  const cLines = wrapText(center.title, 10);
  const cfs = 13, clh = 16;
  const cMaxLen = Math.max(...cLines.map(l => l.length));
  const cLabelW = cMaxLen * cfs + 12, cLabelH = cLines.length * clh + 8;
  const cLabelY = 26;
  let cInner = `<circle r="18" fill="${LAYER_COLORS[center.layer]}"/>`;
  cInner += `<rect x="${-cLabelW/2}" y="${cLabelY}" width="${cLabelW}" height="${cLabelH}" rx="5" fill="rgba(255,255,255,0.95)" stroke="#ff5722" stroke-width="1"/>`;
  cLines.forEach((ln, i) => {
    cInner += `<text y="${cLabelY + 14 + i * clh}" text-anchor="middle" fill="#222" font-size="${cfs}" font-weight="bold">${escHtml(ln)}</text>`;
  });
  gC.innerHTML = cInner;
  gC.onclick = () => showInfo(centerId);
  vp.appendChild(gC);

  // 绘制邻居：标签始终在节点上方
  function drawNb(nb, x, y, compact) {
    const nd = nodes.get(nb.to);
    const col = nd ? LAYER_COLORS[nd.layer] : '#999';
    const title = nd ? nd.title : nb.to;
    const tid = nb.to;
    const isLeaf = nd && !nd.isLayer && !nd.isCategory && nd.layer !== 'root';
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', x); line.setAttribute('y2', y);
    line.setAttribute('class', 'edge');
    if (nb.dir === 'out') line.setAttribute('marker-end', 'url(#arrow)');
    vp.appendChild(line);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node');
    g.setAttribute('transform', `translate(${x},${y})`);
    const dotR = compact ? 8 : 14;
    let inner = `<circle r="${dotR}" fill="${col}"><title>${escHtml(title)}</title></circle>`;
    if (compact) {
      // 紧凑：单行小字，始终在节点上方
      const fs = 8;
      const labelW = title.length * fs + 8, labelH = 16;
      const labelCy = -(dotR + labelH / 2 + 2);
      inner += `<g transform="translate(0,${labelCy})">`;
      inner += `<rect x="${-labelW/2}" y="${-labelH/2}" width="${labelW}" height="${labelH}" rx="3" fill="rgba(255,255,255,0.96)" stroke="#bbb" stroke-width="0.5"/>`;
      inner += `<text y="3" text-anchor="middle" fill="#333" font-size="${fs}">${escHtml(title)}</text>`;
      inner += `</g>`;
    } else {
      // 单环：多行大字标签在下方
      const lines = wrapText(title, 8).slice(0, 6);
      const fs = 11, lh = 14;
      const maxLen = Math.max(...lines.map(l => l.length), 1);
      const labelW = maxLen * fs + 10, labelH = lines.length * lh + 6;
      const labelY = 20;
      inner += `<rect x="${-labelW/2}" y="${labelY}" width="${labelW}" height="${labelH}" rx="4" fill="rgba(255,255,255,0.92)" stroke="#ddd" stroke-width="0.5"/>`;
      lines.forEach((ln, i) => {
        inner += `<text y="${labelY + 12 + i * lh}" text-anchor="middle" fill="#333" font-size="${fs}">${escHtml(ln)}</text>`;
      });
    }
    g.innerHTML = inner;
    g.onclick = (e) => { e.stopPropagation(); if (isLeaf) { selectNode(tid); } else { navigateTo(tid); } };
    vp.appendChild(g);
  }

  const showList = neighbors.slice(0, 72);
  const compact = ringCount > 1;
  if (ringCount === 1) {
    showList.forEach((nb, idx) => {
      const angle = (2 * Math.PI * idx / showList.length) - Math.PI / 2;
      drawNb(nb, cx + R * Math.cos(angle), cy + R * Math.sin(angle), false);
    });
  } else {
    // 多环：按周长比例分配（内圈少、外圈多），环间距拉大
    const ratios = ringCount === 2 ? [0.35, 0.65] : [0.22, 0.33, 0.45];
    const radii = ringCount === 2 ? [R * 0.52, R * 0.95] : [R * 0.40, R * 0.68, R * 0.96];
    let startIdx = 0;
    for (let r = 0; r < ringCount; r++) {
      const count = r === ringCount - 1 ? showList.length - startIdx : Math.round(showList.length * ratios[r]);
      const ringNodes = showList.slice(startIdx, startIdx + count);
      startIdx += count;
      const step = 2 * Math.PI / ringNodes.length;
      ringNodes.forEach((nb, idx) => {
        const angle = idx * step - Math.PI / 2 + r * step / 2;
        drawNb(nb, cx + radii[r] * Math.cos(angle), cy + radii[r] * Math.sin(angle), true);
      });
    }
    const tip = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tip.setAttribute('x', cx); tip.setAttribute('y', cy + R + 30);
    tip.setAttribute('text-anchor', 'middle'); tip.setAttribute('font-size', '12'); tip.setAttribute('fill', '#888');
    tip.textContent = `共 ${neighbors.length} 个 · ${ringCount}环 · 点击直达笔记`;
    vp.appendChild(tip);
  }

  transform = {x: 0, y: 0, k: 1};
  applyTransform();
  showInfo(centerId, neighbors);
}

function showInfo(id, neighbors) {
  const n = nodes.get(id);
  if (!n) return;
  neighbors = neighbors || adj.get(id) || [];
  const tag = n.layer === 'root' ? '根节点' : (n.isLayer ? '层节点' : (n.isCategory ? '分类' : `${n.layer}层·${LAYER_NAMES[n.layer]}`));
  const isKnowledge = !n.isLayer && !n.isCategory && n.layer !== 'root';
  const openBtn = isKnowledge
    ? `<button onclick="openPage('${n.id.replace(/'/g, "\\'")}')" style="margin-top:8px;padding:8px 16px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;width:100%">📖 打开对应笔记</button>
       <button onclick="expandNode('${n.id.replace(/'/g, "\\'")}')" style="margin-top:6px;padding:8px 16px;background:#e8f0fe;color:#1a73e8;border:1px solid #1a73e8;border-radius:6px;font-size:13px;cursor:pointer;width:100%">🌿 在图中展开关系网</button>`
    : '';
  document.getElementById('nodeInfo').innerHTML = `
    <p><span class="layer-tag" style="background:${LAYER_COLORS[n.layer]}">${tag}</span></p>
    <p style="font-weight:600;margin:6px 0;font-size:14px">${escHtml(n.title)}</p>
    ${n.isLayer || n.layer === 'root' ? '' : `<p style="color:#666;font-size:12px;word-break:break-all">${escHtml(n.id)}.md</p>`}
    ${openBtn}
  `;
  document.getElementById('neighborTitle').childNodes[0].textContent = '🌿 相连节点 ';
  document.getElementById('neighborCount').textContent = `(${neighbors.length})`;
  const ul = document.getElementById('neighbors');
  ul.innerHTML = neighbors.map(nb => {
    const nd = nodes.get(nb.to);
    const arrow = nb.dir === 'out' ? '→' : '←';
    const t = nd ? nd.title : nb.to;
    const ndIsLeaf = nd && !nd.isLayer && !nd.isCategory && nd.layer !== 'root';
    const liAction = ndIsLeaf ? `selectNode('${nb.to.replace(/'/g, "\\'")}')` : `navigateTo('${nb.to.replace(/'/g, "\\'")}')`;
    const liIcon = ndIsLeaf ? '📖' : arrow;
    return `<li onclick="${liAction}">${liIcon} ${escHtml(t)}<span class="rel">${escHtml(nb.type)}</span></li>`;
  }).join('') || '<li style="color:#999">暂无相连节点</li>';
}

function openPage(id) {
  const url = 'https://yanghongliang.github.io/obsidian-redirect/#file=' + encodeURIComponent(id + '.md');
  window.open(url, '_blank');
}
function selectNode(id) {
  const n = nodes.get(id);
  const isK = n && !n.isLayer && !n.isCategory && n.layer !== 'root';
  if (isK) openPage(id);
  if (trail[trail.length-1] !== id) { trail.push(id); if (trail.length > 8) trail = trail.slice(-8); }
  renderBreadcrumb();
  showInfo(id);
}
function expandNode(id) {
  // 在图中展开该节点的分支（不打开页面）
  const cur = trail[trail.length - 1];
  if (cur !== id) { trail.push(id); if (trail.length > 8) trail = trail.slice(-8); }
  render(id);
}
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const hits = GRAPH_DATA.nodes.filter(n => n.title.includes(q) || n.id.includes(q));
  if (!hits.length) { alert('未找到包含"' + q + '"的节点'); return; }
  if (hits.length === 1) { trail = [ROOT_ID]; navigateTo(hits[0].id); return; }
  const ul = document.getElementById('neighbors');
  document.getElementById('neighborTitle').childNodes[0].textContent = '🔍 搜索结果 ';
  document.getElementById('neighborCount').textContent = `(${hits.length}个匹配)`;
  ul.innerHTML = hits.slice(0, 40).map(h =>
    `<li onclick="trail=[ROOT_ID];navigateTo('${h.id.replace(/'/g, "\\'")}')">${escHtml(h.title)}<span class="rel">${h.layer}层</span></li>`
  ).join('');
  document.getElementById('nodeInfo').innerHTML = `<p>找到 ${hits.length} 个匹配"${escHtml(q)}"的节点，点击进入：</p>`;
}


// ===== 思维导图（树形）视图 =====
let currentView = 'tree';
let treeData = null;

function buildHierarchy() {
  const root = {id: ROOT_ID, title: '高中物理', layer: 'root', children: [], collapsed: false};
  const layerMap = {};
  Object.keys(layerNodes).forEach(k => {
    const lid = layerNodes[k];
    const ln = nodes.get(lid);
    const lnode = {id: lid, title: ln.title, layer: k, isLayer: true, children: [], collapsed: true};
    layerMap[k] = lnode;
    root.children.push(lnode);
  });
  // 分类节点
  const catMap = {};
  nodes.forEach(n => {
    if (n.isCategory) {
      const cnode = {id: n.id, title: n.title, layer: n.layer, isCategory: true, children: [], collapsed: true};
      catMap[n.id] = cnode;
      if (layerMap[n.layer]) layerMap[n.layer].children.push(cnode);
    }
  });
  // 知识节点挂到分类或层下
  GRAPH_DATA.nodes.forEach(n => {
    const parts = n.id.split('/');
    const knode = {id: n.id, title: n.title, layer: n.layer, children: [], isLeaf: true};
    if (parts.length > 2) {
      const catId = '__CAT_' + n.layer + '_' + parts[1] + '__';
      if (catMap[catId]) catMap[catId].children.push(knode);
      else if (layerMap[n.layer]) layerMap[n.layer].children.push(knode);
    } else {
      if (layerMap[n.layer]) layerMap[n.layer].children.push(knode);
    }
  });
  // 排序：按标题
  function sortChildren(nd) {
    if (nd.children) {
      nd.children.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
      nd.children.forEach(sortChildren);
    }
  }
  sortChildren(root);
  return root;
}

function switchView(v) {
  currentView = v;
  document.getElementById('tabTree').style.background = v === 'tree' ? '#1a73e8' : '#fff';
  document.getElementById('tabTree').style.color = v === 'tree' ? '#fff' : '#1a73e8';
  document.getElementById('tabGraph').style.background = v === 'graph' ? '#1a73e8' : '#fff';
  document.getElementById('tabGraph').style.color = v === 'graph' ? '#fff' : '#1a73e8';
  if (v === 'tree') renderTree();
  else render(trail[trail.length - 1] || ROOT_ID);
}

function renderTree() {
  if (!treeData) treeData = buildHierarchy();
  renderBreadcrumb();
  const svgEl = document.getElementById('svg');
  svgEl.style.display = 'block';
  svgEl.innerHTML = '<g id="viewport"></g>';
  const vp = svgEl.querySelector('#viewport');

  // 布局：计算每个可见节点的位置
  const rowH = 34, colW = 280;
  let yCount = 0;
  function layout(nd, depth) {
    nd.x = depth * colW + 20;
    const kids = nd.collapsed ? [] : (nd.children || []);
    if (kids.length === 0) {
      nd.y = yCount * rowH + 30;
      yCount++;
    } else {
      kids.forEach(k => layout(k, depth + 1));
      nd.y = (kids[0].y + kids[kids.length - 1].y) / 2;
    }
    nd._kids = kids;
  }
  layout(treeData, 0);
  const totalH = yCount * rowH + 60;

  // 绘制连线和节点
  function draw(nd) {
    (nd._kids || []).forEach(k => {
      // 贝塞尔连线
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const x1 = nd.x + (nd._w || 170), y1 = nd.y, x2 = k.x, y2 = k.y;
      const mx = (x1 + x2) / 2;
      path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      path.setAttribute('stroke', '#bbb'); path.setAttribute('fill', 'none'); path.setAttribute('stroke-width', '1.5');
      vp.appendChild(path);
      draw(k);
    });
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node');
    g.setAttribute('transform', `translate(${nd.x},${nd.y})`);
    const col = LAYER_COLORS[nd.layer] || '#999';
    const hasKids = (nd.children || []).length > 0;
    // 宽度自适应全名
    const tw = nd.title.length * 12 + (hasKids ? 44 : 28);
    const w = Math.max(tw, 60), h = 26;
    let inner = `<rect x="0" y="${-h/2}" width="${w}" height="${h}" rx="6" fill="${hasKids ? col : '#fff'}" stroke="${col}" stroke-width="1.5"/>`;
    const tcol = hasKids ? '#fff' : '#333';
    inner += `<text x="10" y="5" fill="${tcol}" font-size="12">${escHtml(nd.title)}</text>`;
    if (hasKids) {
      inner += `<text x="${w - 18}" y="5" fill="${tcol}" font-size="12">${nd.collapsed ? '▶' : '▼'}</text>`;
    }
    if (nd.isLeaf) {
      inner += `<text x="${w + 6}" y="5" fill="#1a73e8" font-size="11">📖</text>`;
    }
    g.innerHTML = inner;
    // 记录节点右边界，供连线使用
    nd._w = w;
    g.onclick = (e) => {
      e.stopPropagation();
      if (nd.isLeaf) { selectNode(nd.id); }
      else { nd.collapsed = !nd.collapsed; renderTree(); }
    };
    // 双击叶子也展开关系网
    vp.appendChild(g);
  }
  draw(treeData);

  // 调整SVG高度
  svgEl.style.height = Math.max(totalH, 600) + 'px';
  svgEl.setAttribute('height', Math.max(totalH, 600));
  transform = {x: 0, y: 0, k: 1};
  applyTransform();
  // 侧栏提示
  document.getElementById('nodeInfo').innerHTML = '<p style="color:#666;font-size:13px;">🌳 点击 <b>▶</b> 展开分支，点击节点名直达笔记<br>📖 图标表示可打开对应笔记</p>';
  document.getElementById('neighborTitle').childNodes[0].textContent = '🌿 相连节点 ';
  document.getElementById('neighborCount').textContent = '';
  document.getElementById('neighbors').innerHTML = '<li style="color:#999">在左侧树中选择节点查看</li>';
}

window.onload = () => { renderTree(); };
window.switchView = switchView;
window.goToTrail = goToTrail;
window.navigateTo = navigateTo;
window.doSearch = doSearch;
window.openPage = openPage;
window.selectNode = selectNode;
window.expandNode = expandNode;
</script>
<script>document.getElementById("hintClose").onclick=function(){document.getElementById("hint").style.display="none";};</script>

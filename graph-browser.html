<style>

#graph{flex:1;position:relative;overflow:hidden;background:#fff}

#nodeInfo{font-size:13px;line-height:1.7}
#nodeInfo .layer-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;color:#fff;margin-right:6px}
#neighbors{list-style:none;display:flex;flex-direction:column;gap:6px}
#neighbors li{padding:8px 10px;background:#f0f4ff;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid transparent;line-height:1.5}
#neighbors li:hover{border-color:#1a73e8;background:#e8f0fe}
#neighbors .rel{font-size:11px;color:#666;background:#e0e0e0;padding:1px 6px;border-radius:3px;margin-left:6px;white-space:nowrap}
#legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px}
#legend span{display:flex;align-items:center;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
svg{width:100%;height:100%;display:block}
.node{cursor:pointer}
.node circle{stroke:#fff;stroke-width:2}
.node text{pointer-events:none}
.node.center circle{stroke:#ff5722;stroke-width:3}
.edge{stroke:#ccc;stroke-width:1.5}
.edge-label{font-size:10px;fill:#666;pointer-events:none;background:#fff}
#hint{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;max-width:320px;line-height:1.6}

const nodes = new Map();
nodes.set(ROOT_ID, {id: ROOT_ID, title: '高中物理', layer: 'root'});
GRAPH_DATA.nodes.forEach(n => nodes.set(n.id, n));

// 层节点
const layerNodes = {};
Object.keys(LAYER_NAMES).forEach(k => {
  if (k === 'root') return;
  const lid = '__LAYER_' + k + '__';
  layerNodes[k] = lid;
  nodes.set(lid, {id: lid, title: k + '层·' + LAYER_NAMES[k], layer: k, isLayer: true});
});

const adj = new Map();
function addEdge(a, b, type, dir) {
  if (!adj.has(a)) adj.set(a, []);
  adj.get(a).push({to: b, type, dir});
}
// 根→层
Object.keys(layerNodes).forEach(k => {
  addEdge(ROOT_ID, layerNodes[k], '包含', 'out');
  addEdge(layerNodes[k], ROOT_ID, '包含', 'in');
});
// 层→节点
GRAPH_DATA.nodes.forEach(n => {
  const lid = layerNodes[n.layer];
  if (lid) { addEdge(lid, n.id, '包含', 'out'); addEdge(n.id, lid, '包含', 'in'); }
});
// 原始边
GRAPH_DATA.edges.forEach(e => {
  addEdge(e.from, e.to, e.type, 'out');
  addEdge(e.to, e.from, e.type, 'in');
});

document.getElementById('stats').textContent = `${GRAPH_DATA.nodes.length} 知识节点 · ${GRAPH_DATA.edges.length} 条关系 · 6 层`;
document.getElementById('legend').innerHTML =
  `<span><span class="dot" style="background:${LAYER_COLORS.root}"></span>根</span>` +
  Object.keys(LAYER_COLORS).filter(k => k !== 'root').map(k =>
    `<span><span class="dot" style="background:${LAYER_COLORS[k]}"></span>${k}层</span>`).join('');

// 面包屑
let trail = [ROOT_ID];
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = trail.map((id, i) => {
    const n = nodes.get(id);
    const label = n ? n.title : id;
    if (i === trail.length - 1) return `<b>${escHtml(label)}</b>`;
    return `<span onclick="goToTrail(${i})">${escHtml(label)}</span><span class="sep">›</span>`;
  }).join('');
}
function goToTrail(i) { trail = trail.slice(0, i + 1); render(trail[trail.length - 1]); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 文字换行：每行最多N个字符
function wrapText(text, maxPerLine) {
  const lines = [];
  let cur = '';
  for (const ch of text) {
    cur += ch;
    if (cur.length >= maxPerLine) { lines.push(cur); cur = ''; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 6); // 最多6行，完整显示
}

const svg = document.getElementById('svg');
let transform = {x: 0, y: 0, k: 1};
let panning = false, panStart = null;
svg.addEventListener('mousedown', e => { panning = true; panStart = {x: e.clientX - transform.x, y: e.clientY - transform.y}; });
window.addEventListener('mouseup', () => panning = false);
window.addEventListener('mousemove', e => { if (panning) { transform.x = e.clientX - panStart.x; transform.y = e.clientY - panStart.y; applyTransform(); } });
svg.addEventListener('wheel', e => { e.preventDefault(); const f = e.deltaY < 0 ? 1.1 : 0.9; transform.k = Math.max(0.25, Math.min(3, transform.k * f)); applyTransform(); }, {passive: false});
function applyTransform() { const g = svg.querySelector('g#viewport'); if (g) g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.k})`); }

function navigateTo(id) {
  if (trail[trail.length - 1] !== id) trail.push(id);
  if (trail.length > 8) trail = trail.slice(-8);
  render(id);
}

function render(centerId) {
  renderBreadcrumb();
  const center = nodes.get(centerId);
  if (!center) return;

  let neighbors = adj.get(centerId) || [];
  const seen0 = new Set();
  neighbors = neighbors.filter(nb => { const k = nb.to; if (seen0.has(k)) return false; seen0.add(k); return true; });
  neighbors.sort((a, b) => {
    const na = nodes.get(a.to), nb2 = nodes.get(b.to);
    const la = na && na.isLayer ? 0 : 1, lb = nb2 && nb2.isLayer ? 0 : 1;
    return la - lb;
  });
  const n = neighbors.length;
  // 自适应环数：<=16单环，17-36双环，37+三环
  const ringCount = n <= 16 ? 1 : (n <= 36 ? 2 : 3);

  svg.innerHTML = '<g id="viewport"></g>';
  const vp = svg.querySelector('#viewport');
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.38;

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = '<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#999"/></marker>';
  vp.appendChild(defs);

  // 中心节点
  const gC = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  gC.setAttribute('class', 'node center');
  gC.setAttribute('transform', `translate(${cx},${cy})`);
  const cLines = wrapText(center.title, 10);
  const cfs = 13, clh = 16;
  const cMaxLen = Math.max(...cLines.map(l => l.length));
  const cLabelW = cMaxLen * cfs + 12, cLabelH = cLines.length * clh + 8;
  const cLabelY = 26;
  let cInner = `<circle r="18" fill="${LAYER_COLORS[center.layer]}"/>`;
  cInner += `<rect x="${-cLabelW/2}" y="${cLabelY}" width="${cLabelW}" height="${cLabelH}" rx="5" fill="rgba(255,255,255,0.95)" stroke="#ff5722" stroke-width="1"/>`;
  cLines.forEach((ln, i) => {
    cInner += `<text y="${cLabelY + 14 + i * clh}" text-anchor="middle" fill="#222" font-size="${cfs}" font-weight="bold">${escHtml(ln)}</text>`;
  });
  gC.innerHTML = cInner;
  gC.onclick = () => showInfo(centerId);
  vp.appendChild(gC);

  // 绘制邻居：标签始终在节点上方
  function drawNb(nb, x, y, compact) {
    const nd = nodes.get(nb.to);
    const col = nd ? LAYER_COLORS[nd.layer] : '#999';
    const title = nd ? nd.title : nb.to;
    const tid = nb.to;
    const isLeaf = nd && !nd.isLayer && nd.layer !== 'root';
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', x); line.setAttribute('y2', y);
    line.setAttribute('class', 'edge');
    if (nb.dir === 'out') line.setAttribute('marker-end', 'url(#arrow)');
    vp.appendChild(line);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node');
    g.setAttribute('transform', `translate(${x},${y})`);
    // 标签参数：密集用紧凑版
    const maxCh = compact ? 5 : 8;
    const fs = compact ? 9 : 11;
    const lh = compact ? 12 : 14;
    const maxLines = compact ? 4 : 6;
    const lines = wrapText(title, maxCh).slice(0, maxLines);
    const maxLen = Math.max(...lines.map(l => l.length), 1);
    const labelW = maxLen * fs + 8, labelH = lines.length * lh + 4;
    // 标签在节点上方：中心位于 (0, -(14 + labelH/2))
    const labelCy = -(14 + labelH / 2);
    const dotR = compact ? 9 : 14;
    let inner = `<circle r="${dotR}" fill="${col}"><title>${escHtml(title)}</title></circle>`;
    inner += `<g transform="translate(0,${labelCy})">`;
    inner += `<rect x="${-labelW/2}" y="${-labelH/2}" width="${labelW}" height="${labelH}" rx="3" fill="rgba(255,255,255,0.94)" stroke="#ccc" stroke-width="0.5"/>`;
    lines.forEach((ln, i) => {
      inner += `<text y="${(i - (lines.length - 1) / 2) * lh + 3}" text-anchor="middle" fill="#333" font-size="${fs}">${escHtml(ln)}</text>`;
    });
    inner += `</g>`;
    g.innerHTML = inner;
    g.onclick = (e) => { e.stopPropagation(); if (isLeaf) { selectNode(tid); } else { navigateTo(tid); } };
    vp.appendChild(g);
  }

  const showList = neighbors.slice(0, 72);
  const compact = ringCount > 1;
  if (ringCount === 1) {
    showList.forEach((nb, idx) => {
      const angle = (2 * Math.PI * idx / showList.length) - Math.PI / 2;
      drawNb(nb, cx + R * Math.cos(angle), cy + R * Math.sin(angle), false);
    });
  } else {
    // 多环：均分节点到各环
    const perRing = Math.ceil(showList.length / ringCount);
    const radii = ringCount === 2 ? [R * 0.55, R * 0.95] : [R * 0.42, R * 0.68, R * 0.94];
    for (let r = 0; r < ringCount; r++) {
      const ringNodes = showList.slice(r * perRing, (r + 1) * perRing);
      ringNodes.forEach((nb, idx) => {
        const angle = (2 * Math.PI * idx / ringNodes.length) - Math.PI / 2 + (r * 0.3);
        drawNb(nb, cx + radii[r] * Math.cos(angle), cy + radii[r] * Math.sin(angle), true);
      });
    }
    const tip = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tip.setAttribute('x', cx); tip.setAttribute('y', cy + R + 30);
    tip.setAttribute('text-anchor', 'middle'); tip.setAttribute('font-size', '12'); tip.setAttribute('fill', '#888');
    tip.textContent = `共 ${neighbors.length} 个 · ${ringCount}环 · 点击直达笔记`;
    vp.appendChild(tip);
  }

  transform = {x: 0, y: 0, k: 1};
  applyTransform();
  showInfo(centerId, neighbors);
}

function showInfo(id, neighbors) {
  const n = nodes.get(id);
  if (!n) return;
  neighbors = neighbors || adj.get(id) || [];
  const tag = n.layer === 'root' ? '根节点' : (n.isLayer ? '层节点' : `${n.layer}层·${LAYER_NAMES[n.layer]}`);
  const isKnowledge = !n.isLayer && n.layer !== 'root';
  const openBtn = isKnowledge
    ? `<button onclick="openPage('${n.id.replace(/'/g, "\\'")}')" style="margin-top:8px;padding:8px 16px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;width:100%">📖 打开对应笔记</button>
       <button onclick="expandNode('${n.id.replace(/'/g, "\\'")}')" style="margin-top:6px;padding:8px 16px;background:#e8f0fe;color:#1a73e8;border:1px solid #1a73e8;border-radius:6px;font-size:13px;cursor:pointer;width:100%">🌿 在图中展开关系网</button>`
    : '';
  document.getElementById('nodeInfo').innerHTML = `
    <p><span class="layer-tag" style="background:${LAYER_COLORS[n.layer]}">${tag}</span></p>
    <p style="font-weight:600;margin:6px 0;font-size:14px">${escHtml(n.title)}</p>
    ${n.isLayer || n.layer === 'root' ? '' : `<p style="color:#666;font-size:12px;word-break:break-all">${escHtml(n.id)}.md</p>`}
    ${openBtn}
  `;
  document.getElementById('neighborTitle').childNodes[0].textContent = '🌿 相连节点 ';
  document.getElementById('neighborCount').textContent = `(${neighbors.length})`;
  const ul = document.getElementById('neighbors');
  ul.innerHTML = neighbors.map(nb => {
    const nd = nodes.get(nb.to);
    const arrow = nb.dir === 'out' ? '→' : '←';
    const t = nd ? nd.title : nb.to;
    const ndIsLeaf = nd && !nd.isLayer && nd.layer !== 'root';
    const liAction = ndIsLeaf ? `selectNode('${nb.to.replace(/'/g, "\\'")}')` : `navigateTo('${nb.to.replace(/'/g, "\\'")}')`;
    const liIcon = ndIsLeaf ? '📖' : arrow;
    return `<li onclick="${liAction}">${liIcon} ${escHtml(t)}<span class="rel">${escHtml(nb.type)}</span></li>`;
  }).join('') || '<li style="color:#999">暂无相连节点</li>';
}

function openPage(id) {
  const url = 'https://yanghongliang.github.io/obsidian-redirect/#file=' + encodeURIComponent(id + '.md');
  window.open(url, '_blank');
}
function selectNode(id) {
  const n = nodes.get(id);
  const isK = n && !n.isLayer && n.layer !== 'root';
  if (isK) openPage(id);
  if (trail[trail.length-1] !== id) { trail.push(id); if (trail.length > 8) trail = trail.slice(-8); }
  renderBreadcrumb();
  showInfo(id);
}
function expandNode(id) {
  // 在图中展开该节点的分支（不打开页面）
  const cur = trail[trail.length - 1];
  if (cur !== id) { trail.push(id); if (trail.length > 8) trail = trail.slice(-8); }
  render(id);
}
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const hits = GRAPH_DATA.nodes.filter(n => n.title.includes(q) || n.id.includes(q));
  if (!hits.length) { alert('未找到包含"' + q + '"的节点'); return; }
  if (hits.length === 1) { trail = [ROOT_ID]; navigateTo(hits[0].id); return; }
  const ul = document.getElementById('neighbors');
  document.getElementById('neighborTitle').childNodes[0].textContent = '🔍 搜索结果 ';
  document.getElementById('neighborCount').textContent = `(${hits.length}个匹配)`;
  ul.innerHTML = hits.slice(0, 40).map(h =>
    `<li onclick="trail=[ROOT_ID];navigateTo('${h.id.replace(/'/g, "\\'")}')">${escHtml(h.title)}<span class="rel">${h.layer}层</span></li>`
  ).join('');
  document.getElementById('nodeInfo').innerHTML = `<p>找到 ${hits.length} 个匹配"${escHtml(q)}"的节点，点击进入：</p>`;
}

window.onload = () => { render(ROOT_ID); };
window.goToTrail = goToTrail;
window.navigateTo = navigateTo;
window.doSearch = doSearch;
window.openPage = openPage;
window.selectNode = selectNode;
window.expandNode = expandNode;
</script>
</body>
</html>
